[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "hy3-code-review-mcp"
version = "0.1.0"
description = "A local stdio MCP server for Hy3-powered code review."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=1.27,<2",
    "openai>=1.50,<3",
    "pydantic>=2,<3",
]

[project.scripts]
hy3-code-review-mcp = "hy3_code_review_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
